[package]
name = "izumi-lisp"
version.workspace = true
description = "tatara-lisp authoring surface for izumi boards — (defizumisource …) + (defizumiboard …) typed forms compiled onto izumi-config"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
# Direct requirement, not transitive convenience: the DeriveTataraDomain
# expansion emits `::serde_json::from_value` INTO this crate for the
# Tier-1 serde-bridged field (`params`), so serde_json must resolve at
# this crate's root.
serde_json = { workspace = true }
# The canonical published Lisp crate. `tatara-lisp-derive` is deliberately
# NOT named here: tatara-lisp re-exports the macros itself, RENAMED
# (`DeriveTataraDomain` / `DeriveKeywordSexp`, so the derive never collides
# with the same-named trait), which keeps lib and derive versions welded
# together instead of free to drift apart — the exact class that forced the
# old `=0.2.4` pin.
tatara-lisp = "0.3.3"
izumi-config = { path = "../izumi-config", version = "0.1.0" }

[lints]
workspace = true
